name: Dataform CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'definitions/**'
      - 'workflow_settings.yaml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'definitions/**'
      - 'workflow_settings.yaml'

jobs:
  compile:
    name: Compile Dataform Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dataform CLI
        run: npm install -g @dataform/cli@3.0.0

      - name: Compile Dataform Project
        run: dataform compile